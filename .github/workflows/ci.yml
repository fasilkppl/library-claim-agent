name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Lint, strict types and the fast unit tests. The model-backed replay and browser tests
    # (`make test-slow`) need the local models and run on the development Mac only.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check src tests --no-fix
          uv run ruff format --check src tests
      - name: Types
        run: uv run mypy
      - name: Unit tests
        run: uv run pytest -q
