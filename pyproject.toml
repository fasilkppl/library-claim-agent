[project]
name = "claimagent"
version = "0.1.0"
description = "Live voice-and-vision agent that inventories, measures and values a home library from one camera sweep."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10",
  "pillow>=10.4",
  "rapidfuzz>=3.9",
  "jinja2>=3.1",
  "faster-whisper>=1.1",
  "kokoro-onnx>=0.4",
  "ultralytics>=8.3",
  "pyobjc-framework-Vision>=10.3; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=10.3; sys_platform == 'darwin'",
  "clip @ git+https://github.com/ultralytics/CLIP.git",
  "playwright>=1.47",  # prints report.html to report.pdf (headless Chromium)
]

[project.scripts]
claim-agent = "claimagent.live.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true  # ultralytics' CLIP fork, needed by YOLO-World

[tool.hatch.build.targets.wheel]
packages = ["src/claimagent"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["slow: needs local models (ollama/whisper/kokoro)", "network: calls public APIs"]
addopts = "-m 'not slow and not network'"

[[tool.mypy.overrides]]
# Incomplete third-party typings (unions with None/Tensor on every result); treated as untyped.
module = ["ultralytics", "ultralytics.*", "cv2", "cv2.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
